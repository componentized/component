version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    groups:
      wac:
        patterns:
          - wac-graph
          - wac-parser
      wasm-tools:
        patterns:
          - wasmparser
          - wasmprinter
          - wat
          - wit-component
          - wit-parser
  - package-ecosystem: cargo
    directory: "/tools"
    schedule:
      interval: daily
  - package-ecosystem: rust-toolchain
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
