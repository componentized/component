version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    groups:
      wasm-tools:
        patterns:
          - wasmparser
          - wat
          - wit-component
          - wit-parser
  - package-ecosystem: rust-toolchain
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
