cargo-features = ["per-package-target"]

[package]
name = "filesystem-loader"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

default-target = "wasm32-wasip3"

[lib]
crate-type = ["cdylib"]
# built for the default-target, a wasm test binary is unable to run on the host
test = false

[dependencies]
wit-bindgen = { workspace = true }
